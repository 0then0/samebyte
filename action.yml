name: SameByte
description: Check that GitHub Actions tests, scans, attests and deploys the same OCI artifact.
inputs:
  path:
    description: Repository, workflow directory or YAML file to analyze. Relative paths resolve against the workspace.
    default: '.'
  format:
    description: 'Output format: text, json or sarif.'
    default: text
  config:
    description: Optional SameByte JSON annotations file. Relative paths resolve against the workspace.
    default: ''
  output:
    description: >-
      Optional file for the report in the selected format. Relative paths resolve
      against the workspace; missing parent directories are created. Without it the
      report is printed to the step log.
    default: ''
outputs:
  report-file:
    description: >-
      Absolute path of the written report. Set only when `output` was given and the
      analysis completed (exit code 0 or 1); empty after an analysis error.
runs:
  using: node24
  main: action/index.mjs
