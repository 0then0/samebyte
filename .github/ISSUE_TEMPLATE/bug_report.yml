name: Bug report
description: Report incorrect analysis, a CLI error, or a documentation problem.
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private URLs, and sensitive output from examples.
        For vulnerabilities, follow the [security policy](https://github.com/0then0/samebyte/security/policy) instead of posting details here.
  - type: input
    id: version
    attributes:
      label: SameByte version
      description: Output of samebyte --version, or the action tag or commit SHA.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Installation method, Node.js version, and operating system or runner.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, minimal workflow, and annotations if relevant. For a documentation issue, link the affected section.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant output and the exit code. For an incorrect finding, include its SB rule ID.
    validations:
      required: true
