name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable SemVer tag such as v0.1.0; got $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$version" != "$(node -p "require('./package.json').version")" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version" >&2
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Validate CLI version
        run: test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"

      - name: Package installable CLI
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          (cd release-assets && sha256sum *.tgz > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/*.tgz release-assets/SHA256SUMS
          --verify-tag --generate-notes --title "$RELEASE_TAG"
